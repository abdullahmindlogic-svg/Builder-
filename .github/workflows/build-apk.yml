name: Build Android APK Server

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'MySecuredApp'
      source_code:
        description: 'HTML/JS Source Code'
        required: true
        default: '<h1>Hello World App</h1>'
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Inject User Source Code
      run: |
        mkdir -p app/src/main/assets
        echo "${{ github.event.inputs.source_code || github.event.client_payload.source_code }}" > app/src/main/assets/index.html

    - name: Grant Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name || github.event.client_payload.app_name || 'SecuredApp' }}-APK
        path: app/build/outputs/apk/debug/app-debug.apk
